e:15.5px;line-height:1.62;color:#4E534A;margin:0\">Situación, recurso disponible y siguiente paso. La lectura más breve y la que más uso para desatascar.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"100\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"border:1px solid rgba(30,31,27,.16);padding:32px;height:100%\"><p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7C8272;margin:0 0 14px\">Vínculo<\u002Fp><h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:23px;margin:0 0 12px\">Qué nos pasa<\u002Fh4><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Tu lugar, el suyo y lo que se mueve entre los dos. Para relaciones que duelen, se repiten o no terminan de cerrarse.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"200\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"border:1px solid rgba(30,31,27,.16);padding:32px;height:100%\"><p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7C8272;margin:0 0 14px\">Ciclo<\u002Fp><h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:23px;margin:0 0 12px\">Etapa que se abre<\u002Fh4><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Una mirada larga para cambios de fase: mudanzas, decisiones, cumpleaños, comienzos de año.<\u002Fp><\u002Fdiv><\u002Fdiv>      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n    <section style=\"padding:0 40px 110px\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:64px;align-items:center\"><div style=\"position:relative;overflow:hidden;min-width:0;height:min(64vh,540px)\"><div data-par=\"38\" style=\"position:absolute;inset:-56px 0\"><div data-rv=\"img\" style=\"position:absolute;inset:0;opacity:0;transform:scale(1.14);transition:opacity 1.1s ease,transform 1.6s cubic-bezier(.22,.7,.2,1)\"><image-slot id=\"tarot-2\" shape=\"rect\" placeholder=\"Detalle de una tirada\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv><\u002Fdiv>      <div style=\"min-width:0\"><div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.4vw,50px);line-height:1.04;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Preguntas que sí funcionan<\u002Fh2><\u002Fdiv>        <p data-rv=\"up\" data-rv-d=\"120\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">“¿Qué necesito ver de esta relación?”, “¿qué me impide cerrar esta etapa?”, “¿qué parte de mí está pidiendo atención?”. Cambiamos el <em>cuándo<\u002Fem> y el <em>quién<\u002Fem> por el <em>qué<\u002Fem> y el <em>para qué<\u002Fem>: ahí es donde el tarot se vuelve herramienta de conciencia y no de ansiedad.<\u002Fp>        <p data-rv=\"up\" data-rv-d=\"200\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Muchas lecturas terminan abriendo un tema familiar. Cuando pasa, te lo digo y decidimos juntas si seguimos con una constelación.<\u002Fp>      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section style=\"padding:0 40px 110px\"><div style=\"max-width:1400px;margin:0 auto\"><div data-rv=\"up\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#3A4234;color:#F1F0EA;padding:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:40px\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(24px,2.6vw,34px);line-height:1.08;margin:0\">Lo que el tarot no hace<\u002Fh3><p style=\"font-size:16.5px;line-height:1.7;color:rgba(241,240,234,.75);margin:0\">No predice el futuro, no diagnostica y no da respuestas sobre terceras personas ni sobre salud, embarazos, procesos judiciales o decisiones médicas. Es una herramienta de reflexión: genera conversación y perspectiva, nada más —y nada menos. Tampoco sustituye a la psicoterapia. Si buscas certezas sobre lo que va a pasar, esta no es la puerta.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══════════════ MEDITACIÓN ══════════════ -->\n  <sc-if value=\"{{ esMeditacion }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"position:relative;z-index:1;background:#F1F0EA\">\n    <section style=\"padding:170px 40px 0\"><div style=\"max-width:1400px;margin:0 auto\"><div style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">03 · Cuerpo y emoción<\u002Fp><\u002Fdiv>      <div style=\"overflow:hidden;padding-bottom:10px\"><h1 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(42px,6.4vw,94px);line-height:.98;margin:0;max-width:22ch;opacity:0;transform:translateY(106%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Meditación y sanación emocional<\u002Fh1><\u002Fdiv>      <p data-rv=\"up\" data-rv-d=\"180\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Cuando la mente no para, el camino es hacia abajo: al cuerpo, a la respiración, a lo que sientes antes de explicarlo. Aquí no vienes a que te calme yo: aprendes a acompañarte tú, con prácticas que puedes repetir sola.<\u002Fp><div style=\"margin-top:52px;position:relative;overflow:hidden;min-width:0;height:min(60vh,520px)\"><div data-par=\"42\" style=\"position:absolute;inset:-56px 0\"><div data-rv=\"img\" style=\"position:absolute;inset:0;opacity:0;transform:scale(1.14);transition:opacity 1.1s ease,transform 1.6s cubic-bezier(.22,.7,.2,1)\"><image-slot id=\"med-hero\" shape=\"rect\" placeholder=\"Imagen serena y amplia (horizontal)\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv><\u002Fdiv>    <\u002Fdiv><\u002Fsection>\n    <section style=\"padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:64px\">      <div style=\"min-width:0\"><div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.4vw,50px);line-height:1.04;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Lo que trabajamos<\u002Fh2><\u002Fdiv><\u002Fdiv>      <div style=\"border-top:1px solid rgba(30,31,27,.16);min-width:0\">        <div data-rv=\"up\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"padding:26px 0;border-bottom:1px solid rgba(30,31,27,.16)\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:0\">Herida de abandono<\u002Fh3><p style=\"font-size:16.5px;line-height:1.66;color:#4E534A;margin:12px 0 0\">Ese miedo antiguo a que se vayan, a molestar, a no ser suficiente. Aprendemos a reconocerlo en el cuerpo antes de que tome las riendas, a sostener a la niña que sigue esperando y a dejar de negociar tu valor.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"80\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"padding:26px 0;border-bottom:1px solid rgba(30,31,27,.16)\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:0\">Duelo y cierres<\u002Fh3><p style=\"font-size:16.5px;line-height:1.66;color:#4E534A;margin:12px 0 0\">Despedidas que no se dijeron: personas, relaciones, versiones de ti. Les damos lugar, palabra y ritual para que dejen de tirar de ti hacia atrás.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"160\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"padding:26px 0;border-bottom:1px solid rgba(30,31,27,.16)\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:0\">Escucha del cuerpo<\u002Fh3><p style=\"font-size:16.5px;line-height:1.66;color:#4E534A;margin:12px 0 0\">Respiración, escaneo corporal y atención al presente para reconocer las señales antes de llegar al límite. El cuerpo avisa mucho antes que la mente.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"240\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"padding:26px 0;border-bottom:1px solid rgba(30,31,27,.16)\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:0\">Amor propio y relaciones conscientes<\u002Fh3><p style=\"font-size:16.5px;line-height:1.66;color:#4E534A;margin:12px 0 0\">Poner límites sin culpa, elegir desde el deseo y no desde el miedo, y aprender a recibir. Prácticas concretas para el día a día, no buenos propósitos.<\u002Fp><\u002Fdiv><\u002Fdiv>      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n    <section style=\"background:#E6E7DE;padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto\"><div style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">De dónde vienen las prácticas<\u002Fp><\u002Fdiv><div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.6vw,54px);line-height:1.04;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Meditación con método, no con humo.<\u002Fh2><\u002Fdiv>      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:26px;margin-top:56px\">        <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#F1F0EA;padding:34px;height:100%\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:0 0 12px\">Raíz contrastada<\u002Fh3><p style=\"font-size:16px;line-height:1.65;color:#4E534A;margin:0\">Muchas de las prácticas que uso vienen del MBSR, el programa de reducción de estrés basado en <em>mindfulness<\u002Fem> que Jon Kabat-Zinn creó en 1979 en la Universidad de Massachusetts. Dura ocho semanas y es el protocolo de meditación más estudiado que existe.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"100\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#F1F0EA;padding:34px;height:100%\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:0 0 12px\">Qué dice la investigación<\u002Fh3><p style=\"font-size:16px;line-height:1.65;color:#4E534A;margin:0\">Los metaanálisis encuentran reducciones del estrés percibido con un efecto moderado, y del malestar por ansiedad y ánimo bajo con un efecto de pequeño a moderado, sostenido de uno a seis meses después. Ayuda de verdad, y no lo cura todo: las dos cosas son ciertas.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"200\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#F1F0EA;padding:34px;height:100%\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:0 0 12px\">Las tres prácticas base<\u002Fh3><p style=\"font-size:16px;line-height:1.65;color:#4E534A;margin:0\">Atención a la respiración, escaneo corporal y meditación caminando. Sencillas, portátiles y adaptadas a tu cuerpo: si estar quieta te angustia, empezamos en movimiento.<\u002Fp><\u002Fdiv><\u002Fdiv>      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n    <section style=\"padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto\"><div style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Acompañamiento en duelo<\u002Fp><\u002Fdiv><div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.4vw,50px);line-height:1.04;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Cuatro tareas para atravesar una pérdida.<\u002Fh2><\u002Fdiv>      <p data-rv=\"up\" data-rv-d=\"150\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">El duelo no tiene fases obligatorias ni plazos. El psicólogo William Worden lo describe como cuatro tareas que se van haciendo, con idas y venidas, cada una a su ritmo. Me apoyo en ellas para saber dónde estás y qué necesitas.<\u002Fp>      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:28px;margin-top:52px\">        <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">01<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:23px;margin:16px 0 10px\">Aceptar que ya no está<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Que la cabeza y el cuerpo lleguen a la misma conclusión, aunque tarden distinto.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"90\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">02<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:23px;margin:16px 0 10px\">Dejar pasar el dolor<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Sentirlo en dosis que puedas sostener, sin anestesiarlo ni quedarte a vivir dentro.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"180\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">03<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:23px;margin:16px 0 10px\">Adaptarte a la ausencia<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Aprender lo que hacía la otra persona, y también quién eres tú ahora sin ella.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"270\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">04<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:23px;margin:16px 0 10px\">Darle un lugar y seguir<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Recolocar el vínculo dentro de ti para que quepa la vida otra vez. No es olvidar: es colocar.<\u002Fp><\u002Fdiv>      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n    <section style=\"padding:0 40px 110px\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:56px;align-items:start\">      <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(24px,2.6vw,36px);margin:0 0 22px\">Tu práctica entre sesiones<\u002Fh3><p style=\"font-size:16.5px;line-height:1.68;color:#3F443C;margin:0 0 22px\">Diez minutos al día sostenidos valen más que una hora el domingo. Empezamos por lo mínimo viable y lo subimos solo si se queda corto.<\u002Fp><div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(30,31,27,.14)\">        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C;display:flex;gap:18px\"><span style=\"color:#6E7A5A;min-width:34px\">01<\u002Fspan><span>Un ancla fija: al despertar, antes de comer o al llegar a casa. Siempre la misma.<\u002Fspan><\u002Fdiv>        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C;display:flex;gap:18px\"><span style=\"color:#6E7A5A;min-width:34px\">02<\u002Fspan><span>Diez respiraciones contadas. Si te pierdes, empiezas otra vez: perderse forma parte.<\u002Fspan><\u002Fdiv>        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C;display:flex;gap:18px\"><span style=\"color:#6E7A5A;min-width:34px\">03<\u002Fspan><span>Una frase al terminar: “¿qué necesito hoy?”. Anótala. En un mes lo verás claro.<\u002Fspan><\u002Fdiv>      <\u002Fdiv><\u002Fdiv>      <div data-rv=\"up\" data-rv-d=\"120\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#B7C1A5;color:#1E1F1B;padding:42px\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:30px;line-height:1.1;margin:0\">Meditaciones guiadas<\u002Fh3><p style=\"font-size:16.5px;line-height:1.66;color:#2C3327;margin:18px 0 0\">En sesión grabamos la práctica que hacemos juntas para que la tengas en tu móvil y la repitas cuando la necesites: la tuya, con tu ritmo y tu voz de referencia, no un audio genérico.<\u002Fp><div style=\"margin-top:30px\"><button sc-camel-on-click=\"{{ abrirCita }}\" style=\"display:flex;align-items:center;gap:14px;border:none;background:#1E1F1B;color:#F1F0EA;padding:17px 28px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .35s ease\" style-hover=\"background:#6E7A5A\">Empezar mi proceso <span>→<\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>    <\u002Fdiv><\u002Fsection>\n    <section style=\"background:#E6E7DE;padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto;text-align:center\">      <div style=\"overflow:hidden;padding-bottom:10px\"><p data-rv=\"mask\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-style:italic;font-size:clamp(26px,3.6vw,50px);line-height:1.22;margin:0 auto;max-width:26ch;opacity:0;transform:translateY(106%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">“Nadie sana lo que no se atreve a sentir.”<\u002Fp><\u002Fdiv>    <\u002Fdiv><\u002Fsection>\n<section style=\"padding:0 40px 110px\"><div style=\"max-width:1400px;margin:0 auto\"><div data-rv=\"up\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#3A4234;color:#F1F0EA;padding:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:40px\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(24px,2.6vw,34px);line-height:1.08;margin:0\">Una nota importante<\u002Fh3><p style=\"font-size:16.5px;line-height:1.7;color:rgba(241,240,234,.75);margin:0\">La meditación regula, acompaña y da herramientas, pero no es un tratamiento de salud mental. Si estás atravesando una depresión, un trastorno de ansiedad, un trauma reciente o tomas medicación, este acompañamiento suma a tu tratamiento; nunca lo sustituye. En algunas personas la práctica intensiva puede remover más de lo esperado: si eso ocurre, paramos, lo hablamos y ajustamos.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══════════════ CONTACTO ══════════════ -->\n  <sc-if value=\"{{ esContacto }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"position:relative;z-index:1; iv style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Cómo funciona<\u002Fp><\u002Fdiv><div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.4vw,50px);line-height:1.04;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">De tu mensaje a la primera sesión, en tres pasos.<\u002Fh2><\u002Fdiv>      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:28px;margin-top:56px\">        <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">1<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">Escribes<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Por Instagram, Facebook o el formulario. No hace falta que lo tengas claro: “no sé por dónde empezar” es un buen primer mensaje.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"90\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">2<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 1 rder-radius:0;cursor:pointer;font-size:16px;transition:background .25s ease\" style-hover=\"background:#E6E7DE\">›<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:5px\">\n                <span style=\"text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8272;padding-bottom:10px\">L<\u002Fspan>\n                <span style=\"text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8272;padding-bottom:10px\">M<\u002Fspan>\n                <span style=\"text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8272;padding-bottom:10px\">X<\u002Fspan>\n                <span style=\"text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8272;padding-bottom:10px\">J<\u002Fspan>\n                <span style=\"text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8272;padding-bottom:10px\">V<\u002Fspan>\n                <span style=\"text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8272;padding-bottom:10px\">S<\u002Fspan>\n                <span style=\"text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8272;padding-bottom:10px\">D<\u002Fspan>\n                <sc-for list=\"{{ cal }}\" as=\"c\" hint-placeholder-count=\"35\">\n                  <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:0;font-size:15px;transition:background .2s ease,color .2s ease;background:{{ c.bg }};color:{{ c.fg }};border:{{ c.bd }};cursor:{{ c.cur }}\">{{ c.n }}<span style=\"width:4px;height:4px;background:{{ c.punto }}\"><\u002Fspan><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;font-size:12px;color:#666B60\">\n                <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:11px;height:11px;background:#E6E7DE;border:1px solid rgba(30,31,27,.14)\"><\u002Fspan>Con huecos<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:11px;height:11px;background:#1E1F1B\"><\u002Fspan>Elegido<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:11px;height:11px;border:1px solid rgba(30,31,27,.14)\"><\u002Fspan>Sin disponibilidad<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 220px;min-width:0\">\n              <sc-if value=\"{{ hayDia }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:24px\">\n                <p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7C8272;margin:0 0 14px;margin:0\">{{ resFecha }}<\u002Fp>\n                <sc-if value=\"{{ hayManana }}\" hint-placeholder-val=\"{{ true }}\">\n                <div><p style=\"font-size:12.5px;color:#666B60;margin:0 0 10px\">Mañana<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px\">\n                  <sc-for list=\"{{ horasManana }}\" as=\"h\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ h.onClick }}\" style=\"padding:15px 10px;font-size:15px;border-radius:0;transition:background .2s ease,color .2s ease;background:{{ h.bg }};color:{{ h.fg }};border:{{ h.bd }};cursor:{{ h.cur }}\">{{ h.t }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ hayTarde }}\" hint-placeholder-val=\"{{ true }}\">\n                <div><p style=\"font-size:12.5px;color:#666B60;margin:0 0 10px\">Tarde<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px\">\n                  <sc-for list=\"{{ horasTarde }}\" as=\"h\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ h.onClick }}\" style=\"padding:15px 10px;font-size:15px;border-radius:0;transition:background .2s ease,color .2s ease;background:{{ h.bg }};color:{{ h.fg }};border:{{ h.bd }};cursor:{{ h.cur }}\">{{ h.t }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-if>\n                <p style=\"font-size:12.5px;line-height:1.6;color:#7C8272;margin:0\">Horas en tu zona horaria. Domingos cerrado; sábados solo mañanas.<\u002Fp>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sinHoras }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:15px;line-height:1.6;color:#4E534A;margin:0;padding:20px;background:#E6E7DE\">Ese día no me queda hueco. Prueba con otro día de los marcados.<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ resPaso3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:26px;max-width:640px\">\n            <div><p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7C8272;margin:0 0 14px\">Nombre *<\u002Fp><input value=\"{{ resNombre }}\" sc-camel-on-change=\"{{ setNombre }}\" placeholder=\"Cómo quieres que te llame\" style=\"width:100%;border:none;border-bottom:1px solid rgba(30,31,27,.24);background:transparent;padding:14px 2px;font-size:17px;color:#1E1F1B;outline:none;font-family:'Archivo',Helvetica,sans-serif\">\n              <sc-if value=\"{{ faltaNombre }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:12.5px;color:#8E4B32;margin:8px 0 0\">Necesito un nombre para la reserva.<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n            <div><p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7C8272;margin:0 0 14px\">Correo o Instagram *<\u002Fp><input value=\"{{ resContacto }}\" sc-camel-on-change=\"{{ setContacto }}\" placeholder=\"tucorreo@ejemplo.com o @tuusuario\" style=\"width:100%;border:none;border-bottom:1px solid rgba(30,31,27,.24);background:transparent;padding:14px 2px;font-size:17px;color:#1E1F1B;outline:none;font-family:'Archivo',Helvetica,sans-serif\">\n              <sc-if value=\"{{ faltaContacto }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:12.5px;color:#8E4B32;margin:8px 0 0\">Sin una forma de contacto no puedo confirmarte la hora.<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n            <div><p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7C8272;margin:0 0 14px\">Teléfono (opcional)<\u002Fp><input value=\"{{ resTel }}\" sc-camel-on-change=\"{{ setTel }}\" placeholder=\"Con prefijo, si prefieres que te llame\" style=\"width:100%;border:none;border-bottom:1px solid rgba(30,31,27,.24);background:transparent;padding:14px 2px;font-size:17px;color:#1E1F1B;outline:none;font-family:'Archivo',Helvetica,sans-serif\"><\u002Fdiv>\n            <div><p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7C8272;margin:0 0 14px\">Qué te trae (opcional)<\u002Fp><textarea value=\"{{ resMotivo }}\" sc-camel-on-change=\"{{ setMotivo }}\" rows=\"4\" placeholder=\"Dos o tres frases bastan. No hace falta ordenarlo.\" style=\"width:100%;border:none;border-bottom:1px solid rgba(30,31,27,.24);background:transparent;padding:14px 2px;font-size:17px;color:#1E1F1B;outline:none;font-family:'Archivo',Helvetica,sans-serif;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n            <p style=\"font-size:12.5px;line-height:1.6;color:#7C8272;margin:0\">Confidencial: esto solo lo leo yo, y nada se guarda en ningún servidor.<\u002Fp>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ resPaso4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\">\n            <div style=\"flex:1 1 320px;min-width:0;border-top:1px solid rgba(30,31,27,.16)\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,31,27,.12);font-size:16px\"><span style=\"color:#7C8272\">Acompañamiento<\u002Fspan><span style=\"text-align:right\">{{ resServicio }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,31,27,.12);font-size:16px\"><span style=\"color:#7C8272\">Día y hora<\u002Fspan><span style=\"text-align:right\">{{ resResumenFecha }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,31,27,.12);font-size:16px\"><span style=\"color:#7C8272\">Modalidad<\u002Fspan><span style=\"text-align:right\">{{ resModalidad }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,31,27,.12);font-size:16px\"><span style=\"color:#7C8272\">Duración<\u002Fspan><span style=\"text-align:right\">{{ resDur }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,31,27,.12);font-size:16px\"><span style=\"color:#7C8272\">A nombre de<\u002Fspan><span style=\"text-align:right\">{{ resNombre }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid rgba(30,31,27,.12);font-size:16px\"><span style=\"color:#7C8272\">Contacto<\u002Fspan><span style=\"text-align:right\">{{ resContacto }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n              <p style=\"font-size:15.5px;line-height:1.65;color:#4E534A;margin:0 0 6px\">Al pulsar un canal te copio la solicitud al portapapeles y abro el chat: solo tienes que pegarla y enviarla.<\u002Fp>\n              <button sc-camel-on-click=\"{{ enviarIg }}\" style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;border:none;background:#1E1F1B;color:#F1F0EA;padding:18px 22px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .3s ease\" style-hover=\"background:#6E7A5A\">Enviar por Instagram <span>→<\u002Fspan><\u002Fbutton>\n              <button sc-camel-on-click=\"{{ enviarFb }}\" style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid rgba(30,31,27,.22);background:transparent;color:#1E1F1B;padding:18px 22px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .3s ease\" style-hover=\"background:#E6E7DE\">Enviar por Facebook <span>→<\u002Fspan><\u002Fbutton>\n              <button sc-camel-on-click=\"{{ bajarIcs }}\" style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;border:none;background:#B7C1A5;color:#1E1F1B;padding:18px 22px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .3s ease\" style-hover=\"background:#C9D2BA\">Añadir a mi calendario <span>↓<\u002Fspan><\u002Fbutton>\n              <sc-if value=\"{{ resCopiado }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:13.5px;line-height:1.6;color:#2C3327;margin:6px 0 0;padding:15px 17px;background:#C9D2BA\">Solicitud copiada. Pégala en el chat que se acaba de abrir y envíala.<\u002Fp>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ reiniciar }}\" style=\"align-self:flex-start;margin-top:6px;background:transparent;border:none;color:#6E7A5A;font-size:13px;cursor:pointer;padding:0;text-decoration:underline\">Empezar de nuevo<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <aside style=\"flex:1 1 300px;min-width:0;background:#3A4234;color:#F1F0EA;padding:30px;display:flex;flex-direction:column;gap:22px\">\n          <div style=\"display:flex;gap:18px;align-items:center\">\n            <div style=\"position:relative;width:84px;height:84px;flex:0 0 auto;overflow:hidden\"><image-slot id=\"cita-retrato\" shape=\"rect\" placeholder=\"Retrato\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"min-width:0\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:20px;margin:0;line-height:1.1\">Rosa Elena Palomino<\u002Fp><p style=\"font-size:12.5px;line-height:1.5;color:rgba(241,240,234,.6);margin:7px 0 0\">Coach espiritual · Consteladora familiar<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(241,240,234,.18)\">\n            <div style=\"display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid rgba(241,240,234,.13);font-size:13.5px\"><span style=\"color:rgba(241,240,234,.55)\">Acompañamiento<\u002Fspan><span style=\"text-align:right\">{{ resServicio }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid rgba(241,240,234,.13);font-size:13.5px\"><span style=\"color:rgba(241,240,234,.55)\">Modalidad<\u002Fspan><span style=\"text-align:right\">{{ resModalidad }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid rgba(241,240,234,.13);font-size:13.5px\"><span style=\"color:rgba(241,240,234,.55)\">Duración<\u002Fspan><span style=\"text-align:right\">{{ resDur }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:14px;padding:13px 0;font-size:13.5px\"><span style=\"color:rgba(241,240,234,.55)\">Cita<\u002Fspan><span style=\"text-align:right\">{{ resResumenFecha }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.6;color:rgba(241,240,234,.5);margin:0\">Solicitud sujeta a confirmación. Te respondo en menos de 24 h laborables y, si esa hora se ha ocupado, te propongo la más cercana.<\u002Fp>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <footer style=\"flex:0 0 auto;border-top:1px solid rgba(30,31,27,.12);background:#F1F0EA;padding:18px 40px\">\n      <div style=\"max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px\">\n        <sc-if value=\"{{ hayAtras }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ atras }}\" style=\"background:transparent;border:1px solid rgba(30,31,27,.2);color:#1E1F1B;border-radius:0;padding:16px 24px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .3s ease\" style-hover=\"background:#E6E7DE\">← Atrás<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ resNoFinal }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ seguir }}\" style=\"margin-left:auto;display:flex;align-items:center;gap:14px;border:none;color:#F1F0EA;padding:17px 30px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;transition:background .3s ease;background:{{ seguirBg }};cursor:{{ seguirCur }}\">{{ seguirTxt }} <span>→<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══════════════ MODAL AVISO ══════════════ -->\n  <sc-if value=\"{{ avisoOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:160;background:rgba(30,31,27,.66);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:28px\">\n    <div style=\"background:#F1F0EA;border-radius:0;max-width:760px;width:100%;position:relative;max-height:88vh;overflow-y:auto\">\n      <button sc-camel-on-click=\"{{ cerrarAviso }}\" style=\"position:absolute;top:18px;right:18px;z-index:2;background:rgba(241,240,234,.9);border:1px solid rgba(30,31,27,.2);color:#1E1F1B;border-radius:0;padding:9px 16px;font-size:12.5px;letter-spacing:.06em;cursor:pointer\">Cerrar ✕<\u002Fbutton>\n      <div style=\"position:relative;height:280px;overflow:hidden;border-radius:0\">\n        <image-slot id=\"aviso-modal\" shape=\"rect\" placeholder=\"Foto del círculo\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"padding:36px 40px 42px\">\n        <p style=\"font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#6E7A5A;margin:0 0 14px\">Próximo encuentro<\u002Fp>\n        <h2 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.4vw,44px);line-height:1.04;margin:0\">Círculo de constelaciones en grupo<\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.7;color:#3F443C;margin:20px 0 0\">Nos reunimos en grupo reducido para constelar. Puedes traer tu tema o participar como representante: las dos formas mueven algo hondo. No hace falta experiencia previa, solo ganas de mirar con honestidad.<\u002Fp>\n        <p style=\"font-size:16.5px;line-height:1.7;color:#3F443C;margin:16px 0 0\">Las plazas son limitadas y las fechas se anuncian primero por Instagram. Si quieres que te avise en cuanto abra la siguiente, escríbeme y te apunto a la lista.<\u002Fp>\n        <a href=\"https://www.instagram.com/sanarconamor.coach\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:10px;margin-top:26px;background:#1E1F1B;color:#F1F0EA;padding:15px 24px;border-radius:0;font-size:14px;transition:background .35s ease\" style-hover=\"background:#6E7A5A;color:#F1F0EA\">Avísame de la fecha <span>→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══════════════ MODAL FICHA ══════════════ -->\n  <sc-if value=\"{{ fichaOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:160;background:rgba(30,31,27,.66);backdrop-filter:blur(7px);display:flex;align-items:flex-start;justify-content:center;padding:28px;overflow-y:auto\">\n    <div style=\"background:#F1F0EA;border-radius:0;max-width:1080px;width:100%;padding:42px;position:relative;margin:auto\">\n      <button sc-camel-on-click=\"{{ cerrarFicha }}\" style=\"position:absolute;top:18px;right:18px;background:transparent;border:1px solid rgba(30,31,27,.2);color:#1E1F1B;border-radius:0;padding:9px 16px;font-size:12.5px;letter-spacing:.06em;cursor:pointer;z-index:2;transition:background .3s ease\" style-hover=\"background:#E6E7DE\">Cerrar ✕<\u002Fbutton>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:42px\">\n        <div style=\"min-width:0\">\n          <div style=\"position:relative;overflow:hidden;border-radius:0;height:360px\">\n            <image-slot id=\"ficha\" shape=\"rect\" placeholder=\"Retrato de Rosa Elena\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <h2 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:32px;margin:24px 0 8px\">Rosa Elena Palomino<\u002Fh2>\n          <p style=\"font-size:14.5px;line-height:1.55;color:#666B60;margin:0\">Coach espiritual · Consteladora familiar · Tarot evolutivo · Meditación<\u002Fp>\n          <button sc-camel-on-click=\"{{ abrirCitaDesdeFicha }}\" style=\"margin-top:22px;border:none;background:#1E1F1B;color:#F1F0EA;padding:14px 22px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .35s ease\" style-hover=\"background:#6E7A5A\">Reservar sesión →<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"min-width:0\">\n          <p style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0 0 16px\">Sobre mí<\u002Fp>\n          <p style=\"font-size:17px;line-height:1.7;color:#3F443C;margin:0\">Llegué a esto por mi propia historia. Tuve que mirar mi herida de abandono, ordenar mi lugar en mi familia y aprender a quedarme conmigo cuando todo pedía huir. Lo que hoy comparto no es teoría: es un camino que he andado.<\u002Fp>\n          <p style=\"font-size:17px;line-height:1.7;color:#3F443C;margin:18px 0 0\">Acompaño desde la escucha, sin prisa y sin juicio. Creo en la ternura como método y en la verdad como medicina: nombrar lo que pasa, aunque incomode, es el primer movimiento de toda sanación.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:36px;margin-top:36px\">\n            <div style=\"min-width:0\">\n              <p style=\"font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7C8272;margin:0 0 16px\">Métodos<\u002Fp>\n              <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:15.5px;color:#3F443C\">\n                <li>Constelaciones familiares<\u002Fli>\n                <li>Tarot evolutivo<\u002Fli>\n                <li>Meditación guiada<\u002Fli>\n                <li>Acompañamiento en duelo<\u002Fli>\n                <li>Trabajo con la niña interior<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div style=\"min-width:0\">\n              <p style=\"font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7C8272;margin:0 0 16px\">Formación<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:10px;font-size:15.5px;color:#3F443C\">\n                <div style=\"display:flex;gap:16px;border-bottom:1px solid rgba(30,31,27,.1);padding-bottom:9px\"><span style=\"color:#6E7A5A;min-width:52px\">2024<\u002Fspan><span>Formación continua en constelaciones<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:16px;border-bottom:1px solid rgba(30,31,27,.1);padding-bottom:9px\"><span style=\"color:#6E7A5A;min-width:52px\">2022<\u002Fspan><span>Tarot evolutivo y simbología<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:16px;border-bottom:1px solid rgba(30,31,27,.1);padding-bottom:9px\"><span style=\"color:#6E7A5A;min-width:52px\">2020<\u002Fspan><span>Meditación y atención plena<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:16px;border-bottom:1px solid rgba(30,31,27,.1);padding-bottom:9px\"><span style=\"color:#6E7A5A;min-width:52px\">2018<\u002Fspan><span>Coaching espiritual<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:16px;padding-bottom:9px\"><span style=\"color:#6E7A5A;min-width:52px\">2016<\u002Fspan><span>Consteladora familiar sistémica<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;variante&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Inicio&quot;},&quot;mostrarAviso&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Inicio&quot;},&quot;mostrarPrecios&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Inicio&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    page: 'inicio', citaOpen: false, fichaOpen: false, avisoOpen: false, menuOpen: false, dropOpen: false, faq: {},\n    w: (typeof window !== 'undefined' ? window.innerWidth : 1280),\n    res: {\n      step: 1, servicio: null, modalidad: 'online', dur: 60,\n      y: new Date().getFullYear(), m: new Date().getMonth(),\n      dia: null, hora: null, nombre: '', contacto: '', tel: '', motivo: '', copiado: false\n    }\n  };\n\n  componentDidMount() {\n    document.documentElement.style.scrollBehavior = 'auto';\n    this.preload();\n    this.bind();\n    this.scan();\n    this.fallback = setTimeout(() => this.revealAll(), 3600);\n  }\n\n  componentDidUpdate() {\n    this.scan();\n    const open = this.state.citaOpen || this.state.fichaOpen || this.state.avisoOpen || this.state.menuOpen;\n    document.body.style.overflow = open ? 'hidden' : '';\n  }\n\n  componentWillUnmount() {\n    clearTimeout(this.fallback);\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('keydown', this.onKey);\n    if (this.io) this.io.disconnect();\n  }\n\n  preload() {\n    const pre = document.getElementById('scam-pre');\n    const num = document.getElementById('scam-count');\n    if (!pre) return;\n    if (sessionStorage.getItem('scam-preloaded')) { pre.style.display = 'none'; return; }\n    const t0 = performance.now();\n    const dur = 1700;\n    const step = (t) => {\n      const p = Math.min(1, (t - t0) / dur);\n      const eased = 1 - Math.pow(1 - p, 3);\n      if (num) num.textContent = String(Math.round(eased * 100)).padStart(2, '0');\n      if (p < 1) requestAnimationFrame(step);\n      else {\n        sessionStorage.setItem('scam-preloaded', '1');\n        pre.style.transform = 'translateY(-100%)';\n        setTimeout(() => { pre.style.display = 'none'; }, 1000);\n      }\n    };\n    requestAnimationFrame(step);\n  }\n\n  bind() {\n    if (this.bound) return;\n    this.bound = true;\n    this.lastY = window.scrollY;\n    this.onScroll = () => {\n      const y = window.scrollY;\n      this.paintNav(y);\n      this.lastY = y;\n      if (!this.ticking) {\n        this.ticking = true;\n        requestAnimationFrame(() => { this.parallax(); this.ticking = false; });\n      }\n    };\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    this.onKey = (e) => {\n      if (e.key === 'Escape') this.setState({ citaOpen: false, fichaOpen: false, avisoOpen: false, menuOpen: false });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('keydown', this.onKey);\n  }\n\n  paintNav(y) {\n    const nav = document.getElementById('scam-nav');\n    if (!nav) return;\n    const modal = this.state.citaOpen || this.state.fichaOpen || this.state.avisoOpen || this.state.menuOpen;\n    nav.style.transform = (!modal && y > 220 && y > (this.lastY || 0)) ? 'translateY(-105%)' : 'translateY(0)';\n    const dark = !!document.querySelector('[data-hero-dark]') && y < window.innerHeight - 110;\n    if (y > 40) {\n      nav.style.background = dark ? 'rgba(30,31,27,.62)' : 'rgba(241,240,234,.9)';\n      nav.style.backdropFilter = 'blur(14px)';\n      nav.style.borderBottomColor = dark ? 'rgba(241,240,234,.14)' : 'rgba(30,31,27,.1)';\n    } else {\n      nav.style.background = 'rgba(241,240,234,0)';\n      nav.style.backdropFilter = 'none';\n      nav.style.borderBottomColor = 'rgba(30,31,27,0)';\n    }\n    document.querySelectorAll('[data-nav-ink]').forEach((el) => { el.style.color = dark ? '#F1F0EA' : '#2C2E29'; });\n    document.querySelectorAll('[data-nav-sub]').forEach((el) => { el.style.color = dark ? 'rgba(241,240,234,.6)' : '#7C8272'; });\n    document.querySelectorAll('[data-nav-btn]').forEach((el) => {\n      el.style.color = dark ? '#F1F0EA' : '#1E1F1B';\n      el.style.borderColor = dark ? 'rgba(241,240,234,.4)' : 'rgba(30,31,27,.25)';\n    });\n    const cta = document.getElementById('scam-cta');\n    const chip = document.getElementById('scam-cta-chip');\n    if (cta) {\n      cta.style.background = dark ? '#F1F0EA' : '#1E1F1B';\n      cta.style.color = dark ? '#1E1F1B' : '#F1F0EA';\n    }\n    if (chip) chip.style.background = dark ? 'rgba(30,31,27,.12)' : 'rgba(241,240,234,.16)';\n  }\n\n  parallax() {\n    const vh = window.innerHeight;\n    document.querySelectorAll('[data-par]').forEach((el) => {\n      const r = el.parentElement.getBoundingClientRect();\n      if (r.bottom < -200 || r.top > vh + 200) return;\n      const amt = parseFloat(el.dataset.par) || 30;\n      const p = ((r.top + r.height / 2) - vh / 2) / vh;\n      el.style.transform = 'translateY(' + (p * amt).toFixed(2) + 'px)';\n    });\n  }\n\n  scan() {\n    if (!this.io) {\n      this.io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          this.show(e.target);\n          this.io.unobserve(e.target);\n        });\n      }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });\n    }\n    clearTimeout(this.fallback);\n    this.fallback = setTimeout(() => this.revealAll(), 2200);\n    requestAnimationFrame(() => {\n      const vh = window.innerHeight;\n      document.querySelectorAll('[data-rv]').forEach((el) => {\n        if (el.dataset.rvOn) return;\n        el.dataset.rvOn = '1';\n        const r = el.getBoundingClientRect();\n        if (r.top < vh * 0.94 && r.bottom > 0) { this.show(el); return; }\n        this.io.observe(el);\n      });\n      document.querySelectorAll('[data-count]').forEach((el) => {\n        if (el.dataset.cOn) return;\n        el.dataset.cOn = '1';\n        this.countObs().observe(el);\n      });\n      document.querySelectorAll('[data-card]').forEach((el) => {\n        if (el.dataset.hOn) return;\n        el.dataset.hOn = '1';\n        const zoom = el.querySelector('[data-zoom]');\n        const arrow = el.querySelector('[data-arrow]');\n        el.addEventListener('mouseenter', () => {\n          if (zoom) zoom.style.transform = 'scale(1.07)';\n          if (arrow) arrow.style.transform = 'translateX(7px)';\n        });\n        el.addEventListener('mouseleave', () => {\n          if (zoom) zoom.style.transform = 'scale(1)';\n          if (arrow) arrow.style.transform = 'translateX(0)';\n        });\n      });\n      this.dragGallery();\n      this.parallax();\n      this.paintNav(window.scrollY);\n      const cta = document.getElementById('scam-cta');\n      if (cta && !cta.dataset.hOn) {\n        cta.dataset.hOn = '1';\n        cta.addEventListener('mouseleave', () => setTimeout(() => this.paintNav(window.scrollY), 20));\n      }\n    });\n  }\n\n  countObs() {\n    if (!this.cio) {\n      this.cio = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          const el = e.target;\n          this.cio.unobserve(el);\n          const target = parseInt(el.dataset.count, 10) || 0;\n          const t0 = performance.now();\n          const run = (t) => {\n            const p = Math.min(1, (t - t0) / 1200);\n            el.textContent = String(Math.round((1 - Math.pow(1 - p, 3)) * target));\n            if (p < 1) requestAnimationFrame(run);\n          };\n          requestAnimationFrame(run);\n        });\n      }, { threshold: 0.4 });\n    }\n    return this.cio;\n  }\n\n  dragGallery() {\n    const gal = document.getElementById('scam-gal');\n    if (!gal || gal.dataset.dOn) return;\n    gal.dataset.dOn = '1';\n    let down = false, sx = 0, sl = 0;\n    gal.addEventListener('mousedown', (e) => { down = true; sx = e.pageX; sl = gal.scrollLeft; gal.style.cursor = 'grabbing'; });\n    window.addEventListener('mouseup', () => { down = false; gal.style.cursor = 'grab'; });\n    gal.addEventListener('mousemove', (e) => { if (!down) return; e.preventDefault(); gal.scrollLeft = sl - (e.pageX - sx) * 1.3; });\n  }\n\n  show(el) {\n    const d = parseInt(el.dataset.rvD, 10) || 0;\n    el.style.transitionDelay = d + 'ms';\n    el.style.opacity = '1';\n    el.style.transform = 'none';\n  }\n\n  revealAll() {\n    document.querySelectorAll('[data-rv]').forEach((el) => {\n      if (parseFloat(getComputedStyle(el).opacity) < 0.9) this.show(el);\n    });\n  }\n\n  go(page) {\n    return (e) => {\n      if (e) e.preventDefault();\n      if (page === this.state.page) {\n        this.setState({ citaOpen: false, fichaOpen: false, avisoOpen: false, menuOpen: false, dropOpen: false });\n        window.scrollTo({ top: 0, behavior: 'smooth' });\n        return;\n      }\n      const c = document.getElementById('scam-curtain');\n      const swap = () => {\n        document.querySelectorAll('[data-rv]').forEach((el) => { delete el.dataset.rvOn; });\n        window.scrollTo(0, 0);\n        this.setState({ page: page, citaOpen: false, fichaOpen: false, avisoOpen: false, menuOpen: false, dropOpen: false });\n      };\n      if (!c) { swap(); return; }\n      c.style.transition = 'transform .5s cubic-bezier(.76,0,.24,1)';\n      c.style.transform = 'translateY(0)';\n      setTimeout(() => {\n        swap();\n        setTimeout(() => {\n          c.style.transform = 'translateY(-100%)';\n          setTimeout(() => { c.style.transition = 'none'; c.style.transform = 'translateY(100%)'; }, 560);\n        }, 60);\n      }, 520);\n    };\n  }\n\n  ancla(id) {\n    return (e) => {\n      if (e) e.preventDefault();\n      const jump = () => {\n        const el = document.getElementById(id);\n        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });\n      };\n      if (this.state.page !== 'inicio') { this.go('inicio')(e); setTimeout(jump, 1100); }\n      else jump();\n    };\n  }\n\n  toggle(n) {\n    return () => this.setState((s) => ({ faq: Object.assign({}, s.faq, { [n]: !s.faq[n] }) }));\n  }\n\n  /* ── sistema de reservas ───────────────────────────── */\n  hash(str) {\n    let h = 0;\n    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 100000;\n    return h;\n  }\n\n  pad(n) { return String(n).padStart(2, '0'); }\n\n  isoOf(y, m, d) { return y + '-' + this.pad(m + 1) + '-' + this.pad(d); }\n\n  horasDe(iso) {\n    const d = new Date(iso + 'T12:00:00');\n    const dow = d.getDay();\n    if (dow === 0) return [];\n    const base = dow === 6 ? ['10:00', '11:30'] : ['10:00', '11:30', '13:00', '16:30', '18:00', '19:30'];\n    const ahora = new Date();\n    const limite = new Date(ahora.getTime() + 4 * 3600 * 1000);\n    return base.map((t) => {\n      const [hh, mm] = t.split(':');\n      const cuando = new Date(iso + 'T' + t + ':00');\n      const ocupada = this.hash(iso + t) % 10 < 3;\n      return { t: t, libre: !ocupada && cuando > limite };\n    });\n  }\n\n  diaDisponible(iso) {\n    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);\n    if (new Date(iso + 'T12:00:00') < hoy) return false;\n    return this.horasDe(iso).some((h) => h.libre);\n  }\n\n  mayus(txt) { return txt ? txt.charAt(0).toUpperCase() + txt.slice(1) : txt; }\n\n  fechaLarga(iso) {\n    if (!iso) return '';\n    const d = new Date(iso + 'T12:00:00');\n    const t = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).format(d).replace(',', '');\n    return this.mayus(t);\n  }\n\n  setRes(patch) {\n    this.setState((s) => ({ res: Object.assign({}, s.res, patch) }));\n  }\n\n  moverMes(delta) {\n    return () => {\n      const r = this.state.res;\n      let m = r.m + delta, y = r.y;\n      if (m < 0) { m = 11; y--; }\n      if (m > 11) { m = 0; y++; }\n      const hoy = new Date();\n      const limite = new Date(hoy.getFullYear(), hoy.getMonth() + 4, 1);\n      if (new Date(y, m, 1) < new Date(hoy.getFullYear(), hoy.getMonth(), 1)) return;\n      if (new Date(y, m, 1) > limite) return;\n      this.setRes({ y: y, m: m });\n    };\n  }\n\n  descargarIcs() {\n    const r = this.state.res;\n    if (!r.dia || !r.hora) return;\n    const ini = new Date(r.dia + 'T' + r.hora + ':00');\n    const fin = new Date(ini.getTime() + r.dur * 60000);\n    const f = (d) => d.getFullYear() + this.pad(d.getMonth() + 1) + this.pad(d.getDate()) + 'T' + this.pad(d.getHours()) + this.pad(d.getMinutes()) + '00';\n    const txt = [\n      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Sanar con Amor//ES', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',\n      'UID:' + Date.now() + '@sanarconamor',\n      'DTSTAMP:' + f(new Date()),\n      'DTSTART:' + f(ini), 'DTEND:' + f(fin),\n      'SUMMARY:Sesión con Rosa Elena Palomino — ' + r.servicio,\n      'DESCRIPTION:' + (r.modalidad === 'online' ? 'Sesión online. Recibirás el enlace por mensaje.' : 'Sesión presencial. Dirección a confirmar.'),\n      'LOCATION:' + (r.modalidad === 'online' ? 'Videollamada' : 'Presencial'),\n      'END:VEVENT', 'END:VCALENDAR'\n    ].join('\\r\\n');\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/calendar;charset=utf-8' }));\n    a.download = 'sesion-sanar-con-amor.ics';\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n  }\n\n  textoReserva() {\n    const r = this.state.res;\n    let tz = '';\n    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { tz = ''; }\n    return [\n      'Hola Rosa Elena, quiero reservar una sesión.',\n      '',\n      'Acompañamiento: ' + r.servicio,\n      'Modalidad: ' + (r.modalidad === 'online' ? 'Online' : 'Presencial'),\n      'Duración: ' + r.dur + ' min',\n      'Fecha: ' + this.fechaLarga(r.dia) + ' a las ' + r.hora + (tz ? ' (' + tz + ')' : ''),\n      'Nombre: ' + r.nombre,\n      'Contacto: ' + r.contacto,\n      r.tel ? 'Teléfono: ' + r.tel : '',\n      '',\n      r.motivo ? 'Qué me trae: ' + r.motivo : ''\n    ].filter(Boolean).join('\\n');\n  }\n\n  enviarReserva(canal) {\n    return () => {\n      const txt = this.textoReserva();\n      try { navigator.clipboard.writeText(txt); } catch (e) { /* sin portapapeles */ }\n      try { localStorage.setItem('scam-reserva', JSON.stringify(this.state.res)); } catch (e) { /* sin storage */ }\n      this.setRes({ copiado: true h.libre ? 'pointer' : 'not-allowed',\n      nota: h.libre ? '' : 'ocupada',\n      onClick: h.libre ? () => this.setRes({ hora: h.t }) : null\n    }));\n    const puedeSeguir = r.step === 1 ? !!r.servicio : r.step === 2 ? !!(r.dia && r.hora) : r.step === 3 ? !!(r.nombre.trim() && r.contacto.trim()) : true;\n    const paso = (n) => (r.step >= n ? '#1E1F1B' : 'rgba(30,31,27,.16)');\n    const manana = horas.filter((h) => parseInt(h.t, 10) < 14);\n    const tarde = horas.filter((h) => parseInt(h.t, 10) >= 14);\n    const irPaso = (n) => () => { if (n <= r.step || n <= (r.maxPaso || 1)) this.setRes({ step: n }); };\n    const pista = r.step === 1 ? 'Puedes cambiar cualquier dato antes de enviar.'\n      : r.step === 2 ? 'Los días con punto tienen huecos libres.'\n      : r.step === 3 ? 'Solo necesito un nombre y una forma de contactarte.'\n      : 'Revisa el resumen y elige por dónde me lo envías.';\n    return {\n      resPaso: r.step,\n      resPaso1: r.step === 1, resPaso2: r.step === 2, resPaso3: r.step === 3, resPaso4: r.step === 4,\n      resTitulo: r.step === 1 ? 'Elige tu acompañamiento' : r.step === 2 ? 'Elige día y hora' : r.step === 3 ? 'Tus datos' : 'Confirma tu solicitud',\n      barra1: paso(1), barra2: paso(2), barra3: paso(3), barra4: paso(4),\n      barra1t: r.step >= 1 ? '#1E1F1B' : '#7C8272', barra2t: r.step >= 2 ? '#1E1F1B' : '#7C8272',\n      barra3t: r.step >= 3 ? '#1E1F1B' : '#7C8272', barra4t: r.step >= 4 ? '#1E1F1B' : '#7C8272',\n      svcConstelacion: pill(r.servicio === 'Constelación familiar').background,\n      svc1Bg: pill(r.servicio === 'Constelación familiar').background,\n      svc1Fg: pill(r.servicio === 'Constelación familiar').color,\n      svc1Bd: pill(r.servicio === 'Constelación familiar').border,\n      svc2Bg: pill(r.servicio === 'Tarot evolutivo').background,\n      svc2Fg: pill(r.servicio === 'Tarot evolutivo').color,\n      svc2Bd: pill(r.servicio === 'Tarot evolutivo').border,\n      svc3Bg: pill(r.servicio === 'Meditación y sanación emocional').background,\n      svc3Fg: pill(r.servicio === 'Meditación y sanación emocional').color,\n      svc3Bd: pill(r.servicio === 'Meditación y sanación emocional').border,\n      elegirSvc1: () => this.setRes({ servicio: 'Constelación familiar' }),\n      elegirSvc2: () => this.setRes({ servicio: 'Tarot evolutivo' }),\n      elegirSvc3: () => this.setRes({ servicio: 'Meditación y sanación emocional' }),\n      modOnBg: pill(r.modalidad === 'online').background, modOnFg: pill(r.modalidad === 'online').color, modOnBd: pill(r.modalidad === 'online').border,\n      modPrBg: pill(r.modalidad === 'presencial').background, modPrFg: pill(r.modalidad === 'presencial').color, modPrBd: pill(r.modalidad === 'presencial').border,\n      elegirOnline: () => this.setRes({ modalidad: 'online' }),\n      elegirPresencial: () => this.setRes({ modalidad: 'presencial' }),\n      dur60Bg: pill(r.dur === 60).background, dur60Fg: pill(r.dur === 60).color, dur60Bd: pill(r.dur === 60).border,\n      dur90Bg: pill(r.dur === 90).background, dur90Fg: pill(r.dur === 90).color, dur90Bd: pill(r.dur === 90).border,\n      elegir60: () => this.setRes({ dur: 60 }), elegir90: () => this.setRes({ dur: 90 }),\n      mesNombre: nombreMes, cal: cal, horas: horas,\n      hayDia: !!r.dia, sinHoras: !!r.dia && horas.length === 0,\n      mesAnterior: this.moverMes(-1), mesSiguiente: this.moverMes(1),\n      resNombre: r.nombre, resContacto: r.contacto, resTel: r.tel, resMotivo: r.motivo,\n      setNombre: (e) => this.setRes({ nombre: e.target.value }),\n      setContacto: (e) => this.setRes({ contacto: e.target.value }),\n      setTel: (e) => this.setRes({ tel: e.target.value }),\n      setMotivo: (e) => this.setRes({ motivo: e.target.value }),\n      resServicio: r.servicio || 'Por elegir',\n      resModalidad: r.modalidad === 'online' ? 'Online' : 'Presencial',\n      resDur: r.dur + ' min',\n      resFecha: r.dia ? this.fechaLarga(r.dia) : 'Sin fecha',\n      resHora: r.hora || '—',\n      resResumenFecha: r.dia && r.hora ? this.fechaLarga(r.dia) + ' · ' + r.hora + ' h' : 'Elige día y hora',\n      resCopiado: !!r.copiado,\n      resNoFinal: r.step < 4,\n      atras: () => this.setRes({ step: Math.max(1, r.step - 1) }),\n      hayAtras: r.step > 1,\n      horasManana: manana, horasTarde: tarde,\n      hayManana: manana.length > 0, hayTarde: tarde.length > 0,\n      irPaso1: irPaso(1), irPaso2: irPaso(2), irPaso3: irPaso(3),\n      pistaPaso: pista,\n      faltaNombre: !!r.intento && !r.nombre.trim(),\n      faltaContacto: !!r.intento && !r.contacto.trim(),\n      seguir: () => {\n        if (!puedeSeguir) { this.setRes({ intento: true }); return; }\n        const n = Math.min(4, r.step + 1);\n        this.setRes({ step: n, intento: false, maxPaso: Math.max(r.maxPaso || 1, n) });\n      },\n      seguirBg: puedeSeguir ? '#1E1F1B' : 'rgba(30,31,27,.28)',\n      seguirCur: puedeSeguir ? 'pointer' : 'default',\n      seguirTxt: r.step === 3 ? 'Revisar' : 'Continuar',\n      enviarIg: this.enviarReserva('ig'),\n      enviarFb: this.enviarReserva('fb'),\n      bajarIcs: () => this.descargarIcs(),\n      reiniciar: () => this.setRes({ step: 1, servicio: null, dia: null, hora: null, copiado: false })\n    };\n  }\n\n  renderVals() {\n    const p = this.state.page;\n    const f = this.state.faq;\n    const vals = {\n      esInicio: p === 'inicio',\n      esConstelaciones: p === 'constelaciones',\n      esTarot: p === 'tarot',\n      esMeditacion: p === 'meditacion',\n      esContacto: p === 'contacto',\n      varA: (this.props.variante ?? 'A') === 'A',\n      varB: (this.props.variante ?? 'A') === 'B',\n      mostrarPrecios: this.props.mostrarPrecios ?? true,\n      mostrarAviso: this.props.mostrarAviso ?? true,\n      escritorio: this.state.w >= 900,\n      movil: this.state.w < 900,\n      dropOpen: this.state.dropOpen,\n      menuOpen: this.state.menuOpen,\n      citaOpen: this.state.citaOpen,\n      fichaOpen: this.state.fichaOpen,\n      avisoOpen: this.state.avisoOpen,\n      irInicio: this.go('inicio'),\n      irConstelaciones: this.go('constelaciones'),\n      irTarot: this.go('tarot'),\n      irMeditacion: this.go('meditacion'),\n      irContacto: this.go('contacto'),\n      abrirDrop: () => this.setState({ dropOpen: true }),\n      cerrarDrop: () => this.setState({ dropOpen: false }),\n      abrirMenu: () => this.setState({ menuOpen: true }),\n      cerrarMenu: () => {\n        const p = document.getElementById('scam-menu');\n        if (!p) { this.setState({ menuOpen: false }); return; }\n        p.style.animation = 'none';\n        p.style.transform = 'translateX(100%)';\n        setTimeout(() => this.setState({ menuOpen: false }), 400);\n      },\n      abrirCita: () => this.setState({ citaOpen: true, fichaOpen: false, avisoOpen: false, menuOpen: false }),\n      cerrarCita: () => this.setState({ citaOpen: false }),\n      abrirFicha: () => this.setState({ fichaOpen: true }),\n      cerrarFicha: () => this.setState({ fichaOpen: false }),\n      abrirAviso: () => this.setState({ avisoOpen: true }),\n      cerrarAviso: () => this.setState({ avisoOpen: false }),\n      abrirCitaDesdeFicha: () => this.setState({ fichaOpen: false, citaOpen: true }),\n      subir: () => window.scrollTo({ top: 0, behavior: 'smooth' }),\n      irPrecios: this.ancla('precios'),\n      irSobreMi: this.ancla('sobre-mi'),\n      irServicios: this.ancla('servicios'),\n      irFaq: this.ancla('faq')\n    };\n    Object.assign(vals, this.reservaVals());\n    for (let i = 1; i <= 6; i++) {\n      vals['toggleFaq' + i] = this.toggle(i);\n      vals['faq' + i + 'Rot'] = f[i] ? '135deg' : '0deg';\n      vals['faq' + i + 'Max'] = f[i] ? '460px' : '0px';\n      vals['faq' + i + 'Op'] = f[i] ? '1' : '0';\n    }\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
