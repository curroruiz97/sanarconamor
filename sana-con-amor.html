document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

etter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Herida de abandono y soledad emocional<\u002Fh4>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"60\" style=\"padding:20px 4px;border-bottom:1px solid rgba(30,31,27,.14);display:flex;gap:20px;align-items:baseline;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.7,.2,1)\">\n              <span style=\"font-size:11px;color:#6E7A5A;letter-spacing:.1em;min-width:26px\">02<\u002Fspan>\n              <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Duelo, rupturas y cierre de relaciones<\u002Fh4>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"120\" style=\"padding:20px 4px;border-bottom:1px solid rgba(30,31,27,.14);display:flex;gap:20px;align-items:baseline;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.7,.2,1)\">\n              <span style=\"font-size:11px;color:#6E7A5A;letter-spacing:.1em;min-width:26px\">03<\u002Fspan>\n              <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Patrones familiares que se repiten generación tras generación<\u002Fh4>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"180\" style=\"padding:20px 4px;border-bottom:1px solid rgba(30,31,27,.14);display:flex;gap:20px;align-items:baseline;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.7,.2,1)\">\n              <span style=\"font-size:11px;color:#6E7A5A;letter-spacing:.1em;min-width:26px\">04<\u002Fspan>\n              <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Vínculos de infancia: madre, padre, hermanos<\u002Fh4>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"240\" style=\"padding:20px 4px;border-bottom:1px solid rgba(30,31,27,.14);display:flex;gap:20px;align-items:baseline;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.7,.2,1)\">\n              <span style=\"font-size:11px;color:#6E7A5A;letter-spacing:.1em;min-width:26px\">05<\u002Fspan>\n              <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Relaciones de pareja: dependencia, celos, límites<\u002Fh4>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"300\" style=\"padding:20px 4px;border-bottom:1px solid rgba(30,31,27,.14);display:flex;gap:20px;align-items:baseline;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.7,.2,1)\">\n              <span style=\"font-size:11px;color:#6E7A5A;letter-spacing:.1em;min-width:26px\">06<\u002Fspan>\n              <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Amor propio y autoestima<\u002Fh4>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"360\" style=\"padding:20px 4px;border-bottom:1px solid rgba(30,31,27,.14);display:flex;gap:20px;align-items:baseline;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.7,.2,1)\">\n              <span style=\"font-size:11px;color:#6E7A5A;letter-spacing:.1em;min-width:26px\">07<\u002Fspan>\n              <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Desconexión del cuerpo: no saber lo que sientes ni lo que quieres<\u002Fh4>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"420\" style=\"padding:20px 4px;border-bottom:1px solid rgba(30,31,27,.14);display:flex;gap:20px;align-items:baseline;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.7,.2,1)\">\n              <span style=\"font-size:11px;color:#6E7A5A;letter-spacing:.1em;min-width:26px\">08<\u002Fspan>\n              <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Estrés, insomnio y agotamiento sostenido<\u002Fh4>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"480\" style=\"padding:20px 4px;border-bottom:1px solid rgba(30,31,27,.14);display:flex;gap:20px;align-items:baseline;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.7,.2,1)\">\n              <span style=\"font-size:11px;color:#6E7A5A;letter-spacing:.1em;min-width:26px\">09<\u002Fspan>\n              <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(20px,2vw,27px);line-height:1.2;margin:0\">Etapas de cambio: mudanzas, maternidad, decisiones grandes<\u002Fh4>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"servicios\" style=\"background:#3A4234;color:#F1F0EA;padding:130px 40px\">\n        <div style=\"max-width:1400px;margin:0 auto\">\n          <div style=\"overflow:hidden;margin-bottom:40px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(241,240,234,.55);margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Acompañamientos<\u002Fp><\u002Fdiv>\n          <div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"80\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(32px,4.4vw,66px);line-height:1.02;letter-spacing:-.02em;margin:0;max-width:24ch;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Tres caminos que se sostienen entre sí.<\u002Fh2><\u002Fdiv>\n          <p data-rv=\"up\" data-rv-d=\"180\" style=\"font-size:17px;line-height:1.66;color:rgba(241,240,234,.7);max-width:60ch;margin:24px 0 0;opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease\">Puedes empezar por donde te resuene. En la primera conversación vemos juntas cuál es la puerta de entrada para tu momento.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin-top:64px\">\n            <a href=\"#\" sc-camel-on-click=\"{{ irConstelaciones }}\" data-rv=\"up\" data-card=\"1\" style=\"display:block;min-width:0;background:rgba(241,240,234,.06);border:1px solid rgba(241,240,234,.14);border-radius:0;padding:24px;color:#F1F0EA;opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1),background .4s ease\" style-hover=\"background:rgba(241,240,234,.12)\">\n              <div style=\"position:relative;overflow:hidden;border-radius:0;height:250px;margin-bottom:26px\">\n                <div data-zoom=\"1\" style=\"position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.22,.7,.2,1)\">\n                  <image-slot id=\"srv-1\" shape=\"rect\" placeholder=\"Imagen constelaciones\"><\u002Fimage-slot>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#C9D2BA;margin:0 0 14px\">01 · Sistémico<\u002Fp>\n              <h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:30px;line-height:1.1;margin:0\">Constelaciones familiares<\u002Fh3>\n              <p style=\"font-size:15.5px;line-height:1.6;color:rgba(241,240,234,.7);margin:14px 0 22px\">Ver el lugar que ocupas en tu sistema, devolver lo heredado y liberar la lealtad invisible que te frena.<\u002Fp>\n              <span style=\"display:inline-flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.03em;color:#C9D2BA\">Conocer más <span data-arrow=\"1\" style=\"display:inline-block;transition:transform .45s cubic-bezier(.22,.7,.2,1)\">→<\u002Fspan><\u002Fspan>\n            <\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ irTarot }}\" data-rv=\"up\" data-rv-d=\"110\" data-card=\"1\" style=\"display:block;min-width:0;background:rgba(241,240,234,.06);border:1px solid rgba(241,240,234,.14);border-radius:0;padding:24px;color:#F1F0EA;opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1),background .4s ease\" style-hover=\"background:rgba(241,240,234,.12)\">\n              <div style=\"position:relative;overflow:hidden;border-radius:0;height:250px;margin-bottom:26px\">\n                <div data-zoom=\"1\" style=\"position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.22,.7,.2,1)\">\n                  <image-slot id=\"srv-2\" shape=\"rect\" placeholder=\"Imagen tarot\"><\u002Fimage-slot>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#C9D2BA;margin:0 0 14px\">02 · Simbólico<\u002Fp>\n              <h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:30px;line-height:1.1;margin:0\">Tarot evolutivo<\u002Fh3>\n              <p style=\"font-size:15.5px;line-height:1.6;color:rgba(241,240,234,.7);margin:14px 0 22px\">No predice: refleja. Las cartas como espejo para nombrar lo que ya sabes y elegir con conciencia.<\u002Fp>\n              <span style=\"display:inline-flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.03em;color:#C9D2BA\">Conocer más <span data-arrow=\"1\" style=\"display:inline-block;transition:transform .45s cubic-bezier(.22,.7,.2,1)\">→<\u002Fspan><\u002Fspan>\n            <\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ irMeditacion }}\" data-rv=\"up\" data-rv-d=\"220\" data-card=\"1\" style=\"display:block;min-width:0;background:rgba(241,240,234,.06);border:1px solid rgba(241,240,234,.14);border-radius:0;padding:24px;color:#F1F0EA;opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1),background .4s ease\" style-hover=\"background:rgba(241,240,234,.12)\">\n              <div style=\"position:relative;overflow:hidden;border-radius:0;height:250px;margin-bottom:26px\">\n                <div data-zoom=\"1\" style=\"position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.22,.7,.2,1)\">\n                  <image-slot id=\"srv-3\" shape=\"rect\" placeholder=\"Imagen meditación\"><\u002Fimage-slot>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#C9D2BA;margin:0 0 14px\">03 · Corporal<\u002Fp>\n              <h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:30px;line-height:1.1;margin:0\">Meditación y sanación emocional<\u002Fh3>\n              <p style=\"font-size:15.5px;line-height:1.6;color:rgba(241,240,234,.7);margin:14px 0 22px\">Volver al cuerpo, sostener el duelo y aprender a escucharte cuando la mente grita.<\u002Fp>\n              <span style=\"display:inline-flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.03em;color:#C9D2BA\">Conocer más <span data-arrow=\"1\" style=\"display:inline-block;transition:transform .45s cubic-bezier(.22,.7,.2,1)\">→<\u002Fspan><\u002Fspan>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <sc-if value=\"{{ mostrarPrecios }}\" hint-placeholder-val=\"{{ true }}\">\n      <section id=\"precios\" style=\"padding:130px 40px\">\n        <div style=\"max-width:1400px;margin:0 auto\">\n          <div style=\"overflow:hidden;margin-bottom:36px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Precios<\u002Fp><\u002Fdiv>\n          <div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"80\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(30px,3.8vw,58px);line-height:1.04;letter-spacing:-.015em;margin:0;max-width:30ch;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Claro desde el principio: sabes lo que pagas antes de entrar.<\u002Fh2><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:60px;margin-top:60px;align-items:start\">\n            <div style=\"position:relative;overflow:hidden;border-radius:0;height:min(70vh,520px);min-width:0\">\n              <div data-par=\"42\" style=\"position:absolute;inset:-60px 0\">\n                <div data-rv=\"img\" style=\"position:absolute;inset:0;opacity:0;transform:scale(1.14);transition:opacity 1.1s ease,transform 1.6s cubic-bezier(.22,.7,.2,1)\">\n                  <image-slot id=\"precios-img\" shape=\"rect\" placeholder=\"Detalle del espacio de consulta (vertical)\"><\u002Fimage-slot>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;min-width:0;border-top:1px solid rgba(30,31,27,.14)\">\n              <div data-rv=\"up\" style=\"padding:26px 0;border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s ease\">\n                <h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:0\">Sesión individual<\u002Fh3>\n                <p style=\"font-size:16px;line-height:1.66;color:#4E534A;margin:12px 0 0\">De 60 a 90 minutos, online o presencial. Tarifa provisional: consúltame por mensaje y te confirmo disponibilidad y precio actualizado.<\u002Fp>\n              <\u002Fdiv>\n              <div data-rv=\"up\" data-rv-d=\"80\" style=\"padding:26px 0;border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s ease\">\n                <h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:0\">Procesos de acompañamiento<\u002Fh3>\n                <p style=\"font-size:16px;line-height:1.66;color:#4E534A;margin:12px 0 0\">Bonos de 4 o 6 sesiones para trabajar un tema en profundidad, con seguimiento entre encuentros. Precio por proceso, no por hora.<\u002Fp>\n              <\u002Fdiv>\n              <div data-rv=\"up\" data-rv-d=\"160\" style=\"padding:26px 0;border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s ease\">\n                <h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:0\">Círculos y talleres en grupo<\u002Fh3>\n                <p style=\"font-size:16px;line-height:1.66;color:#4E534A;margin:12px 0 0\">Constelaciones en grupo y meditaciones guiadas. Aportación reducida, plazas limitadas; se anuncian por Instagram.<\u002Fp>\n              <\u002Fdiv>\n              <div data-rv=\"up\" data-rv-d=\"240\" style=\"padding:26px 0;border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s ease\">\n                <h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:0\">Cancelaciones<\u002Fh3>\n                <p style=\"font-size:16px;line-height:1.66;color:#4E534A;margin:12px 0 0\">Si no puedes venir, avísame con 24 horas de antelación y movemos la cita sin coste. Hay personas esperando ese hueco.<\u002Fp>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ abrirCita }}\" data-rv=\"up\" data-rv-d=\"300\" style=\"align-self:flex-start;margin-top:32px;border:none;background:#1E1F1B;color:#F1F0EA;padding:16px 26px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s ease,background .35s ease\" style-hover=\"background:#6E7A5A\">Reservar sesión →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <section id=\"sobre-mi\" style=\"background:#E6E7DE;padding:130px 40px\">\n        <div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:64px;align-items:center\">\n          <div style=\"min-width:0\">\n            <div style=\"overflow:hidden;padding-bottom:8px\"><p data-rv=\"mask\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-style:italic;font-size:clamp(26px,3.2vw,44px);line-height:1.22;margin:0 0 40px;color:#1E1F1B;opacity:0;transform:translateY(106%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">“Cada persona es única, y así de única es su forma de sanar.”<\u002Fp><\u002Fdiv>\n            <p data-rv=\"up\" data-rv-d=\"120\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0 0 14px;opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease\">Quién te acompaña<\u002Fp>\n            <h3 data-rv=\"up\" data-rv-d=\"180\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:36px;margin:0;opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease\">Rosa Elena Palomino<\u002Fh3>\n            <p data-rv=\"up\" data-rv-d=\"240\" style=\"font-size:15px;line-height:1.6;color:#4E534A;margin:12px 0 0;max-width:46ch;opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease\">Coach espiritual · Consteladora familiar · Tarot evolutivo · Meditación y acompañamiento emocional<\u002Fp>\n            <button sc-camel-on-click=\"{{ abrirFicha }}\" data-rv=\"up\" data-rv-d=\"300\" style=\"display:inline-flex;align-items:center;gap:12px;margin-top:30px;border:1px solid rgba(30,31,27,.24);background:transparent;color:#1E1F1B;padding:15px 24px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease,border-color .35s ease,background .35s ease\" style-hover=\"border-color:#1E1F1B;background:#C9D2BA\">Conocer a Rosa Elena <span>→<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"position:relative;overflow:hidden;border-radius:0;height:min(78vh,660px);min-width:0\">\n            <div data-par=\"48\" style=\"position:absolute;inset:-66px 0\">\n              <div data-rv=\"img\" style=\"position:absolute;inset:0;opacity:0;transform:scale(1.14);transition:opacity 1.1s ease,transform 1.6s cubic-bezier(.22,.7,.2,1)\">\n                <image-slot id=\"retrato\" shape=\"rect\" placeholder=\"Retrato de Rosa Elena (vertical)\"><\u002Fimage-slot>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"faq\" style=\"padding:130px 40px\">\n        <div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:64px;align-items:start\">\n          <div style=\"min-width:0\">\n            <div style=\"overflow:hidden\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0 0 22px;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Preguntas frecuentes<\u002Fp><\u002Fdiv>\n            <div style=\"overflow:hidden;padding-bottom:6px\"><h2 data-rv=\"mask\" data-rv-d=\"80\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(30px,3.4vw,52px);line-height:1.05;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Las dudas de antes de la primera sesión.<\u002Fh2><\u002Fdiv>\n            <p data-rv=\"up\" data-rv-d=\"160\" style=\"font-size:16px;line-height:1.66;color:#4E534A;margin:20px 0 0;opacity:0;transform:translateY(20px);transition:opacity .9s ease,transform .9s ease\">Si te queda algo por preguntar, escríbeme sin compromiso. Responder también es parte del acompañamiento.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(30,31,27,.14);min-width:0\">\n            <div data-rv=\"up\" style=\"border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease\">\n              <button sc-camel-on-click=\"{{ toggleFaq1 }}\" style=\"width:100%;display:flex;gap:24px;align-items:baseline;justify-content:space-between;background:transparent;border:none;padding:24px 2px;cursor:pointer;text-align:left;color:#1E1F1B\">\n                <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(19px,1.8vw,25px);margin:0;line-height:1.24\">¿Necesito conocer mi historia familiar para constelar?<\u002Fh4>\n                <span style=\"font-size:20px;color:#6E7A5A;line-height:1;transition:transform .4s cubic-bezier(.22,.7,.2,1);transform:rotate({{ faq1Rot }})\">+<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.2,1),opacity .45s ease;max-height:{{ faq1Max }};opacity:{{ faq1Op }}\">\n                <p style=\"font-size:16.5px;line-height:1.7;color:#4E534A;margin:0;padding:0 60px 26px 2px\">No. Basta con lo que sabes y con lo que sientes hoy. A veces los silencios y los “no sé” dicen tanto como los datos; el sistema se muestra igual.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"60\" style=\"border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease\">\n              <button sc-camel-on-click=\"{{ toggleFaq2 }}\" style=\"width:100%;display:flex;gap:24px;align-items:baseline;justify-content:space-between;background:transparent;border:none;padding:24px 2px;cursor:pointer;text-align:left;color:#1E1F1B\">\n                <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(19px,1.8vw,25px);margin:0;line-height:1.24\">¿Las sesiones son online o presenciales?<\u002Fh4>\n                <span style=\"font-size:20px;color:#6E7A5A;line-height:1;transition:transform .4s cubic-bezier(.22,.7,.2,1);transform:rotate({{ faq2Rot }})\">+<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.2,1),opacity .45s ease;max-height:{{ faq2Max }};opacity:{{ faq2Op }}\">\n                <p style=\"font-size:16.5px;line-height:1.7;color:#4E534A;margin:0;padding:0 60px 26px 2px\">Ambas. Online funcionan igual de bien: solo necesitas una hora sin interrupciones, buena conexión y un lugar donde puedas hablar tranquila.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"120\" style=\"border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease\">\n              <button sc-camel-on-click=\"{{ toggleFaq3 }}\" style=\"width:100%;display:flex;gap:24px;align-items:baseline;justify-content:space-between;background:transparent;border:none;padding:24px 2px;cursor:pointer;text-align:left;color:#1E1F1B\">\n                <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(19px,1.8vw,25px);margin:0;line-height:1.24\">¿Cuánto dura y cada cuánto conviene venir?<\u002Fh4>\n                <span style=\"font-size:20px;color:#6E7A5A;line-height:1;transition:transform .4s cubic-bezier(.22,.7,.2,1);transform:rotate({{ faq3Rot }})\">+<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.2,1),opacity .45s ease;max-height:{{ faq3Max }};opacity:{{ faq3Op }}\">\n                <p style=\"font-size:16.5px;line-height:1.7;color:#4E534A;margin:0;padding:0 60px 26px 2px\">Entre 60 y 90 minutos la primera vez. Después solemos espaciar las sesiones de dos a cuatro semanas: lo que se mueve necesita tiempo para asentarse.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"180\" style=\"border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease\">\n              <button sc-camel-on-click=\"{{ toggleFaq4 }}\" style=\"width:100%;display:flex;gap:24px;align-items:baseline;justify-content:space-between;background:transparent;border:none;padding:24px 2px;cursor:pointer;text-align:left;color:#1E1F1B\">\n                <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(19px,1.8vw,25px);margin:0;line-height:1.24\">¿Esto sustituye a la terapia psicológica o al médico?<\u002Fh4>\n                <span style=\"font-size:20px;color:#6E7A5A;line-height:1;transition:transform .4s cubic-bezier(.22,.7,.2,1);transform:rotate({{ faq4Rot }})\">+<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.2,1),opacity .45s ease;max-height:{{ faq4Max }};opacity:{{ faq4Op }}\">\n                <p style=\"font-size:16.5px;line-height:1.7;color:#4E534A;margin:0;padding:0 60px 26px 2px\">No. Es un acompañamiento espiritual y emocional, complementario y nunca sustitutivo de un tratamiento médico o psicológico. Si estás en terapia, seguimos sumando; si crees que la necesitas, te lo diré con honestidad.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"240\" style=\"border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease\">\n              <button sc-camel-on-click=\"{{ toggleFaq5 }}\" style=\"width:100%;display:flex;gap:24px;align-items:baseline;justify-content:space-between;background:transparent;border:none;padding:24px 2px;cursor:pointer;text-align:left;color:#1E1F1B\">\n                <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(19px,1.8vw,25px);margin:0;line-height:1.24\">¿Qué pasa si me remuevo mucho en la sesión?<\u002Fh4>\n                <span style=\"font-size:20px;color:#6E7A5A;line-height:1;transition:transform .4s cubic-bezier(.22,.7,.2,1);transform:rotate({{ faq5Rot }})\">+<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.2,1),opacity .45s ease;max-height:{{ faq5Max }};opacity:{{ faq5Op }}\">\n                <p style=\"font-size:16.5px;line-height:1.7;color:#4E534A;margin:0;padding:0 60px 26px 2px\">Que estás en buenas manos. Trabajamos a tu ritmo, cerramos siempre lo que se abre y te doy pautas sencillas para los días siguientes. Nada se queda a medias.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-rv=\"up\" data-rv-d=\"300\" style=\"border-bottom:1px solid rgba(30,31,27,.14);opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease\">\n              <button sc-camel-on-click=\"{{ toggleFaq6 }}\" style=\"width:100%;display:flex;gap:24px;align-items:baseline;justify-content:space-between;background:transparent;border:none;padding:24px 2px;cursor:pointer;text-align:left;color:#1E1F1B\">\n                <h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(19px,1.8vw,25px);margin:0;line-height:1.24\">¿Cómo reservo mi cita?<\u002Fh4>\n                <span style=\"font-size:20px;color:#6E7A5A;line-height:1;transition:transform .4s cubic-bezier(.22,.7,.2,1);transform:rotate({{ faq6Rot }})\">+<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.2,1),opacity .45s ease;max-height:{{ faq6Max }};opacity:{{ faq6Op }}\">\n                <p style=\"font-size:16.5px;line-height:1.7;color:#4E534A;margin:0;padding:0 60px 26px 2px\">Escríbeme por Instagram o Facebook contándome brevemente qué te trae. Te propongo un par de horarios y elegimos el que mejor te venga.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding:0 0 130px\">\n        <div id=\"scam-gal\" style=\"display:flex;gap:14px;overflow-x:auto;padding:0 40px 16px;cursor:grab\">\n          <div data-rv=\"up\" style=\"flex:0 0 300px;height:390px;position:relative;overflow:hidden;border-radius:0;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease\"><image-slot id=\"g1\" shape=\"rect\" placeholder=\"Galería 1\"><\u002Fimage-slot><\u002Fdiv>\n          <div data-rv=\"up\" data-rv-d=\"60\" style=\"flex:0 0 240px;height:390px;position:relative;overflow:hidden;border-radius:0;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease\"><image-slot id=\"g2\" shape=\"rect\" placeholder=\"Galería 2\"><\u002Fimage-slot><\u002Fdiv>\n          <div data-rv=\"up\" data-rv-d=\"120\" style=\"flex:0 0 380px;height:390px;position:relative;overflow:hidden;border-radius:0;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease\"><image-slot id=\"g3\" shape=\"rect\" placeholder=\"Galería 3\"><\u002Fimage-slot><\u002Fdiv>\n          <div data-rv=\"up\" data-rv-d=\"180\" style=\"flex:0 0 260px;height:390px;position:relative;overflow:hidden;border-radius:0;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease\"><image-slot id=\"g4\" shape=\"rect\" placeholder=\"Galería 4\"><\u002Fimage-slot><\u002Fdiv>\n          <div data-rv=\"up\" data-rv-d=\"240\" style=\"flex:0 0 320px;height:390px;position:relative;overflow:hidden;border-radius:0;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease\"><image-slot id=\"g5\" shape=\"rect\" placeholder=\"Galería 5\"><\u002Fimage-slot><\u002Fdiv>\n          <div data-rv=\"up\" data-rv-d=\"300\" style=\"flex:0 0 240px;height:390px;position:relative;overflow:hidden;border-radius:0;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease\"><image-slot id=\"g6\" shape=\"rect\" placeholder=\"Galería 6\"><\u002Fimage-slot><\u002Fdiv>\n          <div data-rv=\"up\" data-rv-d=\"360\" style=\"flex:0 0 360px;height:390px;position:relative;overflow:hidden;border-radius:0;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease\"><image-slot id=\"g7\" shape=\"rect\" placeholder=\"Galería 7\"><\u002Fimage-slot><\u002Fdiv>\n          <div data-rv=\"up\" data-rv-d=\"420\" style=\"flex:0 0 280px;height:390px;position:relative;overflow:hidden;border-radius:0;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease\"><image-slot id=\"g8\" shape=\"rect\" placeholder=\"Galería 8\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══════════════ CONSTELACIONES ══════════════ -->\n  <sc-if value=\"{{ esConstelaciones }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"position:relative;z-index:1;background:#F1F0EA\">\n    <section style=\"padding:170px 40px 0\"><div style=\"max-width:1400px;margin:0 auto\"><div style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">01 · Acompañamiento sistémico<\u002Fp><\u002Fdiv>      <div style=\"overflow:hidden;padding-bottom:10px\"><h1 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(42px,6.4vw,94px);line-height:.98;margin:0;max-width:20ch;opacity:0;transform:translateY(106%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Constelaciones familiares<\u002Fh1><\u002Fdiv>\n      <p data-rv=\"up\" data-rv-d=\"180\" style=\"font-size:18.5px;line-height:1.64;color:#4E534A;max-width:60ch;margin:26px 0 0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease\">Una forma de mirar tu vida desde el sistema al que perteneces. El método lo desarrolló el psicoterapeuta alemán Bert Hellinger a partir de un patrón que observó una y otra vez: cuando alguien de la familia queda fuera —una pérdida, un secreto, una persona de la que no se habla—, el sistema busca reequilibrarse, y alguien de las generaciones siguientes acaba cargando con lo que no le toca.<\u002Fp>\n<div style=\"margin-top:52px;position:relative;overflow:hidden;min-width:0;height:min(66vh,580px)\"><div data-par=\"44\" style=\"position:absolute;inset:-56px 0\"><div data-rv=\"img\" style=\"position:absolute;inset:0;opacity:0;transform:scale(1.14);transition:opacity 1.1s ease,transform 1.6s cubic-bezier(.22,.7,.2,1)\"><image-slot id=\"const-hero\" shape=\"rect\" placeholder=\"Imagen amplia para constelaciones (horizontal)\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv><\u002Fdiv>    <\u002Fdiv><\u002Fsection>\n    <section style=\"padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:64px\">      <div style=\"min-width:0\"><div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.4vw,50px);line-height:1.04;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">¿Qué es constelar?<\u002Fh2><\u002Fdiv><\u002Fdiv>      <div style=\"min-width:0\">        <p data-rv=\"up\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Traemos tu sistema al presente: con representantes en un grupo, con figuras sobre la mesa o simplemente con tu cuerpo y el espacio. No hace falta que sepas fechas ni nombres exactos; basta con lo que sabes y con lo que sientes hoy.<\u002Fp>        <p data-rv=\"up\" data-rv-d=\"100\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Cuando la imagen se despliega, casi siempre aparece algo que no esperabas: un lugar vacío, una lealtad antigua, una carga que pertenece a otra generación. Desde ahí trabajamos con movimientos sencillos y muy concretos: mirar, nombrar, agradecer, devolver, soltar.<\u002Fp>        <p data-rv=\"up\" data-rv-d=\"200\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">No hay que entenderlo todo con la cabeza. Suele pasar al revés: el cuerpo se ordena primero y la comprensión llega después, a veces días más tarde.<\u002Fp>      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n    <section style=\"background:#E6E7DE;padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto\"><div style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Los órdenes del amor<\u002Fp><\u002Fdiv><div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.6vw,54px);line-height:1.04;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Tres leyes silenciosas que sostienen a toda familia.<\u002Fh2><\u002Fdiv>      <p data-rv=\"up\" data-rv-d=\"150\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Hellinger las llamó “órdenes del amor”. Cuando se respetan, el afecto circula; cuando se rompen, aparecen el síntoma, la repetición y el desencuentro. Casi todo lo que miramos en sesión toca una de las tres.<\u002Fp>      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:26px;margin-top:56px\">        <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">01<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:18px 0 12px\">Pertenencia<\u002Fh3><p style=\"font-size:16px;line-height:1.65;color:#4E534A;margin:0\">Todos los que formaron parte del sistema tienen derecho a estar en él: el hijo que no llegó, la pareja anterior, el familiar del que nadie habla. Excluir a alguien deja un hueco, y tarde o temprano alguien lo ocupa sin saberlo.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"100\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">02<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:18px 0 12px\">Jerarquía<\u002Fh3><p style=\"font-size:16px;line-height:1.65;color:#4E534A;margin:0\">Quien llegó antes tiene precedencia. Los padres son los grandes y los hijos, los pequeños. Cuando una hija sostiene emocionalmente a su madre, o un hijo ocupa el lugar de la pareja ausente, el orden se invierte y pesa.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"200\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:40px;margin:0;line-height:1;color:#6E7A5A\">03<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:26px;margin:18px 0 12px\">Equilibrio<\u002Fh3><p style=\"font-size:16px;line-height:1.65;color:#4E534A;margin:0\">Dar y recibir necesitan compensarse. Quien solo da se agota y acaba resentida; quien solo recibe se queda en deuda. En los vínculos sanos el intercambio se mueve, no se estanca.<\u002Fp><\u002Fdiv>      <\u002Fdiv>      <p style=\"font-size:13px;line-height:1.6;color:#666B60;margin:34px 0 0;max-width:70ch\">Marco conceptual de Bert Hellinger (1925–2019), psicoterapeuta y creador del enfoque sistémico de constelaciones familiares.<\u002Fp>    <\u002Fdiv><\u002Fsection>\n    <section style=\"padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto\"><div style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Cómo es el proceso<\u002Fp><\u002Fdiv>      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:28px\">        <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:44px;margin:0;line-height:1;color:#6E7A5A\">1<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">Tu tema<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Empezamos por lo que te pesa hoy. Una frase basta: “no consigo irme”, “siempre me eligen a medias”.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"90\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:44px;margin:0;line-height:1;color:#6E7A5A\">2<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">El mapa<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Miramos quién está en tu sistema y qué lugar ocupa cada uno. Aparece la imagen que sostiene el síntoma.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"180\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:44px;margin:0;line-height:1;color:#6E7A5A\">3<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">El movimiento<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Trabajamos frases y gestos que reordenan: reconocer, devolver lo que no te toca, ocupar tu sitio.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"270\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:44px;margin:0;line-height:1;color:#6E7A5A\">4<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">El reposo<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Cerramos y te llevas pautas para los días siguientes. Lo que se movió sigue trabajando en silencio.<\u002Fp><\u002Fdiv>      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n    <section style=\"padding:0 40px 110px\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:56px;align-items:start\">      <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><h2 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(26px,2.8vw,40px);line-height:1.08;margin:0 0 26px\">Para ti si…<\u002Fh2><ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px\">        <li style=\"font-size:16.5px;line-height:1.6;color:#3F443C;padding-left:22px;position:relative\"><span style=\"position:absolute;left:0;color:#6E7A5A\">·<\u002Fspan>Repites la misma historia con distintas personas.<\u002Fli>        <li style=\"font-size:16.5px;line-height:1.6;color:#3F443C;padding-left:22px;position:relative\"><span style=\"position:absolute;left:0;color:#6E7A5A\">·<\u002Fspan>Sientes una tristeza o un miedo que no sabes de dónde vienen.<\u002Fli>        <li style=\"font-size:16.5px;line-height:1.6;color:#3F443C;padding-left:22px;position:relative\"><span style=\"position:absolute;left:0;color:#6E7A5A\">·<\u002Fspan>Hay un duelo, una ausencia o un tema del que en casa no se habla.<\u002Fli>        <li style=\"font-size:16.5px;line-height:1.6;color:#3F443C;padding-left:22px;position:relative\"><span style=\"position:absolute;left:0;color:#6E7A5A\">·<\u002Fspan>Cuidas de todos y a ti nadie te sostiene.<\u002Fli>        <li style=\"font-size:16.5px;line-height:1.6;color:#3F443C;padding-left:22px;position:relative\"><span style=\"position:absolute;left:0;color:#6E7A5A\">·<\u002Fspan>Quieres cerrar una etapa y no logras dar el paso.<\u002Fli>      <\u002Ful><\u002Fdiv>      <div data-rv=\"up\" data-rv-d=\"120\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#B7C1A5;color:#1E1F1B;padding:42px\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:32px;line-height:1.1;margin:0\">Individual o en grupo<\u002Fh3><p style=\"font-size:16.5px;line-height:1.66;color:#2C3327;margin:18px 0 0\">En sesión individual trabajamos solo con tu tema, online o presencial. En los círculos en grupo constelas tu historia con el apoyo de otras personas, o participas como representante: prestar tu presencia a la historia de otro también mueve la propia.<\u002Fp><div style=\"margin-top:30px\"><button sc-camel-on-click=\"{{ abrirCita }}\" style=\"display:flex;align-items:center;gap:14px;border:none;background:#1E1F1B;color:#F1F0EA;padding:17px 28px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .35s ease\" style-hover=\"background:#6E7A5A\">Reservar sesión <span>→<\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>    <\u002Fdiv><\u002Fsection>\n    <section style=\"padding:0 40px 110px\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:56px\">      <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(22px,2.2vw,30px);margin:0 0 20px\">Cómo prepararte<\u002Fh3><div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(30,31,27,.14)\">        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C\">Trae una sola pregunta. Cuantos menos temas, más hondo llegamos.<\u002Fdiv>        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C\">Si los conoces, ten a mano los hechos duros del sistema: muertes tempranas, pérdidas de bebés, separaciones, migraciones, exclusiones.<\u002Fdiv>        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C\">Reserva una hora sin prisa después. No encadenes la sesión con una reunión.<\u002Fdiv>      <\u002Fdiv><\u002Fdiv>      <div data-rv=\"up\" data-rv-d=\"120\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(22px,2.2vw,30px);margin:0 0 20px\">Y después<\u002Fh3><div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(30,31,27,.14)\">        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C\">No analices la imagen ni la cuentes demasiado. Deja que repose unos días.<\u002Fdiv>        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C\">Es normal sentir cansancio, sueños intensos o una calma extraña. Bebe agua, camina, duerme.<\u002Fdiv>        <div style=\"padding:16px 0;border-bottom:1px solid rgba(30,31,27,.14);font-size:16px;line-height:1.6;color:#3F443C\">Lo que se movió suele verse en las semanas siguientes, no en la misma tarde. Por eso espaciamos las sesiones.<\u002Fdiv>      <\u002Fdiv><\u002Fdiv>    <\u002Fdiv><\u002Fsection>\n<section style=\"padding:0 40px 110px\"><div style=\"max-width:1400px;margin:0 auto\"><div data-rv=\"up\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#3A4234;color:#F1F0EA;padding:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:40px\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(24px,2.6vw,34px);line-height:1.08;margin:0\">Con honestidad<\u002Fh3><p style=\"font-size:16.5px;line-height:1.7;color:rgba(241,240,234,.75);margin:0\">Las constelaciones familiares son un trabajo simbólico y experiencial, no un tratamiento clínico: no cuentan con evidencia científica concluyente ni sustituyen a la psicoterapia, al seguimiento médico o a la medicación. Yo no diagnostico ni interrumpo tratamientos. Si en algún momento veo que lo que traes necesita atención profesional, te lo diré con claridad y te animaré a buscarla —podemos seguir acompañándonos en paralelo.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══════════════ TAROT ══════════════ -->\n  <sc-if value=\"{{ esTarot }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"position:relative;z-index:1;background:#F1F0EA\">\n    <section style=\"padding:170px 40px 0\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:56px;align-items:end\">      <div style=\"min-width:0\"><div style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">02 · Lectura simbólica<\u002Fp><\u002Fdiv>        <div style=\"overflow:hidden;padding-bottom:10px\"><h1 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(42px,6.2vw,90px);line-height:.98;margin:0;opacity:0;transform:translateY(106%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">Tarot evolutivo<\u002Fh1><\u002Fdiv>        <p data-rv=\"up\" data-rv-d=\"180\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Las cartas no deciden por ti ni te dicen qué va a pasar. Trabajan como espejo: ponen imagen y palabra a lo que ya intuyes, para que puedas elegir despierta en lugar de repetir en automático.<\u002Fp>        <div style=\"margin-top:34px\" data-rv=\"up\" data-rv-d=\"260\"><button sc-camel-on-click=\"{{ abrirCita }}\" style=\"display:flex;align-items:center;gap:14px;border:none;background:#1E1F1B;color:#F1F0EA;padding:17px 28px;border-radius:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .35s ease\" style-hover=\"background:#6E7A5A\">Pedir una lectura <span>→<\u002Fspan><\u002Fbutton><\u002Fdiv>      <\u002Fdiv><div style=\"position:relative;overflow:hidden;min-width:0;height:min(66vh,600px)\"><div data-par=\"40\" style=\"position:absolute;inset:-56px 0\"><div data-rv=\"img\" style=\"position:absolute;inset:0;opacity:0;transform:scale(1.14);transition:opacity 1.1s ease,transform 1.6s cubic-bezier(.22,.7,.2,1)\"><image-slot id=\"tarot-hero\" shape=\"rect\" placeholder=\"Cartas sobre tela\"><\u002Fimage-slot><\u002Fdiv><\u002Fdiv><\u002Fdiv>    <\u002Fdiv><\u002Fsection>\n    <section style=\"padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:26px\">      <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#E6E7DE;padding:36px;height:100%\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:27px;line-height:1.12;margin:0\">No es adivinación<\u002Fh3><p style=\"font-size:16px;line-height:1.64;color:#4E534A;margin:16px 0 0\">El tarot predictivo intenta anticipar el futuro. El evolutivo pone el foco en el aquí y ahora: tu momento, tus recursos y lo que se te está pidiendo soltar.<\u002Fp><\u002Fdiv><\u002Fdiv>      <div data-rv=\"up\" data-rv-d=\"100\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#E6E7DE;padding:36px;height:100%\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:27px;line-height:1.12;margin:0\">Es un espejo<\u002Fh3><p style=\"font-size:16px;line-height:1.64;color:#4E534A;margin:16px 0 0\">Cada arcano nombra una parte de ti. Al verla fuera, sobre la mesa, deja de doler tanto y por fin puede hablarse. Las preguntas las haces tú; yo solo sostengo el hilo.<\u002Fp><\u002Fdiv><\u002Fdiv>      <div data-rv=\"up\" data-rv-d=\"200\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"background:#E6E7DE;padding:36px;height:100%\"><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:27px;line-height:1.12;margin:0\">Termina en acción<\u002Fh3><p style=\"font-size:16px;line-height:1.64;color:#4E534A;margin:16px 0 0\">Salimos con algo concreto: una conversación pendiente, un límite, un descanso, un gesto de amor propio. Si no aterriza en la vida, no ha servido.<\u002Fp><\u002Fdiv><\u002Fdiv>    <\u002Fdiv><\u002Fsection>\n    <section style=\"background:#E6E7DE;padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:64px\">      <div style=\"min-width:0\"><div style=\"overflow:hidden;padding-bottom:8px\"><h2 data-rv=\"mask\" data-rv-d=\"70\" style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:clamp(28px,3.4vw,50px);line-height:1.04;margin:0;opacity:0;transform:translateY(108%);transition:opacity 1s ease,transform 1.1s cubic-bezier(.22,.7,.2,1)\">De dónde viene esta forma de leer.<\u002Fh2><\u002Fdiv>        <p data-rv=\"up\" data-rv-d=\"160\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">El tarot nació como juego de cartas en el Renacimiento europeo. Su lectura simbólica moderna llega mucho después, y debe casi todo a la psicología profunda.<\u002Fp><\u002Fdiv>      <div style=\"min-width:0;border-top:1px solid rgba(30,31,27,.16)\">        <div data-rv=\"up\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"display:flex;gap:24px;padding:22px 0;border-bottom:1px solid rgba(30,31,27,.16)\"><span style=\"color:#6E7A5A;min-width:64px;font-size:14px\">1909<\u002Fspan><p style=\"margin:0;font-size:16.5px;line-height:1.65;color:#3F443C\">Arthur E. Waite y Pamela Colman Smith publican la baraja Rider-Waite-Smith, la primera que ilustra todos los arcanos con escenas simbólicas. Es la base visual del tarot que se usa hoy.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"80\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"display:flex;gap:24px;padding:22px 0;border-bottom:1px solid rgba(30,31,27,.16)\"><span style=\"color:#6E7A5A;min-width:64px;font-size:14px\">Jung<\u002Fspan><p style=\"margin:0;font-size:16.5px;line-height:1.65;color:#3F443C\">Carl Gustav Jung aporta tres ideas que lo cambian todo: los arquetipos, el inconsciente colectivo y la sincronicidad. Para él las cartas no predicen: son imágenes donde la psique se contempla a sí misma y avanza hacia la individuación.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"160\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"display:flex;gap:24px;padding:22px 0;border-bottom:1px solid rgba(30,31,27,.16)\"><span style=\"color:#6E7A5A;min-width:64px;font-size:14px\">1980<\u002Fspan><p style=\"margin:0;font-size:16.5px;line-height:1.65;color:#3F443C\">Rachel Pollack publica <em>Seventy-Eight Degrees of Wisdom<\u002Fem> y consolida el tarot psicológico. Después, autoras como Mary K. Greer y Angeles Arrien desarrollan métodos de lectura arquetípica.<\u002Fp><\u002Fdiv><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"240\" style=\"opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"display:flex;gap:24px;padding:22px 0;border-bottom:1px solid rgba(30,31,27,.16)\"><span style=\"color:#6E7A5A;min-width:64px;font-size:14px\">Hoy<\u002Fspan><p style=\"margin:0;font-size:16.5px;line-height:1.65;color:#3F443C\">Las escuelas de tarot evolutivo en Europa y Latinoamérica trabajan la lectura como conversación introspectiva: la carta abre el tema, la persona le da sentido.<\u002Fp><\u002Fdiv><\u002Fdiv>      <\u002Fdiv><\u002Fdiv><\u002Fsection>\n    <section style=\"padding:110px 40px\"><div style=\"max-width:1400px;margin:0 auto\"><div style=\"overflow:hidden;margin-bottom:34px\"><p data-rv=\"mask\" style=\"font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7C8272;margin:0;opacity:0;transform:translateY(110%);transition:opacity .8s ease,transform .9s cubic-bezier(.22,.7,.2,1)\">Cómo es una lectura<\u002Fp><\u002Fdiv>      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:28px\">        <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:44px;margin:0;line-height:1;color:#6E7A5A\">1<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">La pregunta<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Dedicamos los primeros minutos a afinarla. Es la parte más importante: una buena pregunta ya es media respuesta.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"90\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:44px;margin:0;line-height:1;color:#6E7A5A\">2<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">La tirada<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Elijo la estructura según lo que traes. Pocas cartas, bien miradas, dicen más que una mesa llena.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"180\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:44px;margin:0;line-height:1;color:#6E7A5A\">3<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">El diálogo<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Te pregunto qué ves antes de decirte lo que veo. Tu lectura del símbolo suele ser la más certera.<\u002Fp><\u002Fdiv>        <div data-rv=\"up\" data-rv-d=\"270\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><p style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:44px;margin:0;line-height:1;color:#6E7A5A\">4<\u002Fp><h3 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:24px;margin:16px 0 10px\">El paso<\u002Fh3><p style=\"font-size:15.5px;line-height:1.62;color:#4E534A;margin:0\">Cerramos con una acción pequeña y realista para esta semana. Te la mando por escrito si quieres.<\u002Fp><\u002Fdiv>      <\u002Fdiv>      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:26px;margin-top:64px\">        <div data-rv=\"up\" style=\"min-width:0;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.22,.7,.2,1)\"><div style=\"border:1px solid rgba(30,31,27,.16);padding:32px;height:100%\"><p style=\"font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7C8272;margin:0 0 14px\">Tres cartas<\u002Fp><h4 style=\"font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.025em;font-size:23px;margin:0 0 12px\">Dónde estoy<\u002Fh4><p style=\"font-siz
